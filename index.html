     tags:["Computer Vision","YOLOv2","Behavior Analysis","CCTV"],
     body:`### 연구 배경
- 기존 CCTV 영상 분석은 주로 **옵티컬 플로우(optical flow) 기반 움직임 감지**에 의존
- 이 방식은 움직임은 잡아내지만, **무엇이** 움직이는지(객체 인식)와 **어떤 행동인지**(행동 분류)를 구분하는 데 한계가 있음
- 그래서 CCTV 영상에서 위험 행동과 흉기 같은 위험 물체를 **실시간으로** 감지하는 지능형 감시 시스템을 제안
### 제안 방법
- **YOLOv2** 객체 탐지 모델과 **행동 분석 알고리즘**을 결합한 통합 프레임워크를 설계
- YOLOv2: 실시간 감시 환경에서 사람과 위험 물체를 빠르고 정확하게 탐지
- 행동 분석 모듈: 탐지된 객체들의 **공간적 관계와 상호작용 패턴**을 바탕으로 위험 행동을 분류
### 감지 대상
| 구분 | 대상 |
| 위험 행동 | 폭행, 실신, 넘어짐 |
| 위험 물체 | 흉기 등 무기 |
### 기대 효과
- 위험 상황을 **실시간으로 감지하고 알림** → 범죄와 사고의 조기 예방
- 공공 안전 향상에 기여

function md(src){
  const lines=src.replace(/^\n+|\n+$/g,"").split("\n"); let h="",i=0;
  const inl=t=>esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  while(i<lines.length){
    let l=lines[i];
    if(l.startsWith("```")){let c=[];i++;while(i<lines.length&&!lines[i].startsWith("```")){c.push(lines[i]);i++}i++;h+=`<pre>${esc(c.join("\n"))}</pre>`;continue}
    if(l.startsWith("#### ")){h+=`<h4>${inl(l.slice(5))}</h4>`;i++;continue}
    if(l.startsWith("### ")){h+=`<h3>${inl(l.slice(4))}</h3>`;i++;continue}
    if(l.startsWith("|")){let r=[];while(i<lines.length&&lines[i].startsWith("|")){r.push(lines[i].replace(/^\||\|$/g,"").split("|").map(x=>x.trim()));i++}
      h+=`<div style="overflow-x:auto"><table><thead><tr>${r[0].map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${r.slice(1).map(x=>`<tr>${x.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;continue}
    if(/^\s*- /.test(l)){let u=[];while(i<lines.length&&/^\s*- /.test(lines[i])){const sub=/^\s+- /.test(lines[i]);u.push(`<li${sub?' class="sub"':""}>${inl(lines[i].replace(/^\s*- /,""))}</li>`);i++}h+=`<ul>${u.join("")}</ul>`;continue}
    if(/^\[\[playground:/.test(l.trim())){i++;continue}
    if(l.trim()){h+=`<p>${inl(l)}</p>`}
    i++;
  }
  return h;
}

let tTimer=null;
function typeLoop(arr){
  clearTimeout(tTimer);
  const el=$("typed"); if(!el) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=arr[0];return}
  let k=0,i=0,del=false;
  const step=()=>{
    if(!$("typed")) return;
    const ch=[...arr[k]];
    if(!del){ i++; el.textContent=ch.slice(0,i).join(""); if(i>=ch.length){del=true; tTimer=setTimeout(step,2200); return} tTimer=setTimeout(step,70); }
    else { i--; el.textContent=ch.slice(0,i).join(""); if(i<=0){del=false; k=(k+1)%arr.length; tTimer=setTimeout(step,400); return} tTimer=setTimeout(step,28); }
  };
  tTimer=setTimeout(step,500);
}

function reveal(){

  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});

}

(function(){

  function init(){

    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    const n=Math.round(W*H/2600);
    stars=Array.from({length:n},()=>{const z=Math.random();return{x:Math.random()*W,y:Math.random()*H,z,r:z*1.4+.25,a:Math.random()*Math.PI*2,s:.5+Math.random()*1.5,c:Math.random()<.12?(Math.random()<.5?"201,192,255":"158,241,255"):"255,255,255"}});
  }
  addEventListener("resize",init);
  addEventListener("pointermove",e=>{tx=(e.clientX/W-.5);ty=(e.clientY/H-.5)});
  function frame(t){
    const dt=Math.min(50,t-last); last=t;
    mx+=(tx-mx)*.04; my+=(ty-my)*.04;
    ctx.clearRect(0,0,W,H);
    const sc=scrollY;
    for(const s of stars){
      if(!reduce){ s.y-=s.z*.012*dt; s.a+=.0016*s.s*dt; }
      if(s.y<-4){s.y=H+4;s.x=Math.random()*W}
      const px=s.x-mx*40*s.z, py=((s.y-my*30*s.z-sc*s.z*.15)%(H+8)+H+8)%(H+8)-4;
      const tw=reduce?1:.55+.45*Math.sin(s.a);
      ctx.beginPath(); ctx.fillStyle=`rgba(${s.c},${(.35+.65*s.z)*tw})`; ctx.arc(px,py,s.r,0,6.283); ctx.fill();
      if(s.r>1.35){ctx.beginPath();ctx.fillStyle=`rgba(${s.c},${.08*tw})`;ctx.arc(px,py,s.r*4,0,6.283);ctx.fill()}
    }
    if(!reduce){
      if(!shoot && t>nextShoot){ const a=Math.PI*(.18+Math.random()*.12); shoot={x:Math.random()*W*.7+W*.2,y:Math.random()*H*.35,vx:-Math.cos(a)*1.1,vy:Math.sin(a)*1.1,life:0}; }
      if(shoot){
        shoot.life+=dt; const L=Math.min(1,shoot.life/200), x=shoot.x+shoot.vx*shoot.life, y=shoot.y+shoot.vy*shoot.life;
        const g=ctx.createLinearGradient(x,y,x-shoot.vx*140*L,y-shoot.vy*140*L);
        const fade=Math.max(0,1-shoot.life/1100);
        g.addColorStop(0,`rgba(255,255,255,${.9*fade})`); g.addColorStop(1,"rgba(158,241,255,0)");
        ctx.strokeStyle=g; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-shoot.vx*140*L,y-shoot.vy*140*L); ctx.stroke();
        if(shoot.life>1100){shoot=null; nextShoot=t+5000+Math.random()*6000;}
      }
    }
    requestAnimationFrame(frame);
  }
  init(); requestAnimationFrame(frame);
})();
</script>

<script>
document.addEventListener("click",e=>{
  const p=e.target.closest(".planet");if(!p)return;
  const o=p.parentElement;
  p.classList.remove("pop");void p.offsetWidth;p.classList.add("pop");
  const add=(cls,st,delay,life)=>setTimeout(()=>{const el=document.createElement("span");el.className=cls;for(const k in st)el.style.setProperty(k,st[k]);o.appendChild(el);setTimeout(()=>el.remove(),life)},delay);
  add("burst",{},0,1000);
  const cols=["#8f7dff","#5ee7ff","#b6a9ff","#5ee7ff"];
  cols.forEach((c,i)=>add("wave",{"--wc":c},i*180,1700));
  for(let i=0;i<14;i++){const a=(-90+(Math.random()*120-60))*Math.PI/180,r=120+Math.random()*120;
    add("spark",{"--wc":cols[i%2],"--dx":Math.cos(a)*r+"px","--dy":Math.sin(a)*r+"px"},Math.random()*150,1200)}
});
</script>
